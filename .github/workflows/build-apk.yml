name: StockPilot APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build User APK
        run: gradle -p UserApp assembleDebug

      - name: Build Developer APK
        run: gradle -p DeveloperApp assembleDebug

      - name: Upload APK files
        uses: actions/upload-artifact@v4
        with:
          name: StockPilot-Android-APKs
          path: |
            UserApp/app/build/outputs/apk/debug/*.apk
            DeveloperApp/app/build/outputs/apk/debug/*.apk
